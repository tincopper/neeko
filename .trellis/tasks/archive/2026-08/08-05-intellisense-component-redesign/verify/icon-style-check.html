<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>completion icon style verify</title>
<style>
  :root {
    --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
    --bg-hover: #1f6feb22; --border-color: #30363d; --text-primary: #e6edf3;
    --text-secondary: #8b949e; --text-muted: #6e7681; --accent-blue: #58a6ff;
    --accent-purple: #bc8cff; --accent-green: #3fb950; --accent-orange: #d29922;
    --accent-yellow: #e3b341;
  }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: system-ui; padding: 24px; }
  .row { display: flex; gap: 32px; align-items: flex-start; }
  .group-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 13px; }
  /* ===== completionTheme.ts 的 icon 样式（原样提取） ===== */
  .cm-completionIcon {
    width: 16px; height: 16px; font-size: 0; position: relative; flex-shrink: 0;
    margin-right: 8px; margin-top: 1px; vertical-align: middle;
  }
  .cm-completionIcon::before {
    content: ""; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; font-size: 10px; font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1;
  }
  .cm-completionIcon-function::before { background: var(--accent-blue); color: #fff; content: "ƒ"; font-style: italic; }
  .cm-completionIcon-method::before { background: #79c0ff; color: #1a1a1a; content: "m"; }
  .cm-completionIcon-constructor::before { background: var(--accent-purple, #a855f7); color: #fff; content: "C"; }
  .cm-completionIcon-class::before, .cm-completionIcon-interface::before { background: var(--accent-purple, #a855f7); color: #fff; content: "C"; }
  .cm-completionIcon-variable::before, .cm-completionIcon-property::before, .cm-completionIcon-field::before { background: var(--accent-green); color: #fff; content: "v"; }
  .cm-completionIcon-constant::before { background: var(--accent-yellow); color: #fff; content: "◆"; font-size: 9px; }
  .cm-completionIcon-keyword::before { background: var(--accent-purple, #a855f7); color: #fff; content: "K"; font-size: 9px; }
  .cm-completionIcon-type::before { background: var(--accent-cyan, #06b6d4); color: #fff; content: "T"; font-size: 9px; }
  /* ===== 原型 prototype-autocomplete.html 的 icon 样式 ===== */
  .proto .completion-icon { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; font-family: var(--font-ui); color: #fff; line-height: 1; }
  .proto .icon-function { background: var(--accent-blue); }
  .proto .icon-class { background: var(--accent-purple); }
  .proto .icon-variable { background: var(--accent-green); }
  .proto .icon-method { background: #79c0ff; }
  .proto .icon-constant { background: var(--accent-yellow); color: #1a1a1a; }
</style>
</head>
<body>
<div class="row">
  <div class="proto">
    <div class="group-title">原型（prototype-autocomplete.html）</div>
    <div class="item"><span class="completion-icon icon-function">ƒ</span> function（函数）</div>
    <div class="item"><span class="completion-icon icon-method">m</span> method（方法）</div>
    <div class="item"><span class="completion-icon icon-variable">v</span> variable（变量）</div>
    <div class="item"><span class="completion-icon icon-class">C</span> class（类）</div>
    <div class="item"><span class="completion-icon icon-constant">◆</span> constant（常量）</div>
  </div>
  <div>
    <div class="group-title">completionTheme.ts（修复后生效的映射）</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-function"></span> type='function' → ƒ</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-method"></span> type='method' → m</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-variable"></span> type='variable' → v</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-class"></span> type='class' → C</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-constant"></span> type='constant' → ◆</div>
    <div class="item"><span class="cm-completionIcon cm-completionIcon-property"></span> type='property'（bug 时的 fallback）→ v</div>
  </div>
</div>
</body>
</html>
