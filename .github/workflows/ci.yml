name: CI

# PR 和 main 分支 push 时触发，前置发现质量问题
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # 前端检查：单平台即可（TypeScript/Vitest 无平台差异）
  # ──────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: TypeScript check
        run: pnpm tsc --noEmit

  frontend-test:
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Unit tests
        run: pnpm test

  # ──────────────────────────────────────────────
  # Java 调试 host：编译 + 自检（源码解析顺序 / 缓存布局 / 断点 FQN 推导）
  # host 是宿主 jar，Rust/cargo 门禁覆盖不到，故单列一个 job（需 JDK + Maven Central）
  # ──────────────────────────────────────────────
  java-host-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build.sh：下载 core + 依赖 → 编译 host → 自检（test.sh）→ 打 fat jar
      - name: Build host and run self-check
        run: bash tools/java-host/build.sh

  # ──────────────────────────────────────────────
  # 后端检查：全平台 check（发现跨平台编译问题）
  # ──────────────────────────────────────────────
  backend-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust check
        run: cargo check
        working-directory: ./src-tauri

      - name: Rust clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Guard worktree byte assertions in git tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 .trellis/scripts/check_worktree_byte_assertions.py

      - name: Guard platform-specific imports
        if: matrix.os == 'ubuntu-latest'
        run: python3 .trellis/scripts/check_platform_imports.py

      - name: Guard path identity scope (same-file checks must use FileRef)
        if: matrix.os == 'ubuntu-latest'
        run: python3 .trellis/scripts/check_path_identity_scope.py

      - name: Guard AGENTS.md size and red-line routing
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m unittest discover -s .trellis/scripts -p 'test_*.py'
          python3 .trellis/scripts/check_agents_md_size.py

  backend-test:
    needs: backend-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust test
        run: cargo test
        working-directory: ./src-tauri
