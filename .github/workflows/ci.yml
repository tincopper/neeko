name: CI

# PR 和 main 分支 push 时触发，前置发现质量问题
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # 前端检查：单平台即可（TypeScript/Vitest 无平台差异）
  # ──────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      # 与本地 commit 档**同一条命令**（静态检查的定义单点在 package.json）：eslint + tsc。
      # 此前 eslint 只在本地 pre-commit 跑、CI 不跑 ⇒ 门的强度取决于「谁装了钩子」。
      - name: Frontend static checks
        run: pnpm lint:fe

  frontend-test:
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      # 带覆盖率跑（同一趟测试，多出 v8 插桩开销 ~30%）：`vitest.config.ts` 里的地板
      # （全局回归底线 + 按文件 pin 的阈值）**只在这里生效** —— 此前 `test:fe:coverage`
      # 没有任何调用方，于是地板是装饰性的，`useFileEditorLsp.ts` 就是那样漂掉的。
      # 本地 push 档不跑它（延迟预算），要提前发现就跑 `pnpm test:fe:coverage`。
      - name: Unit tests + coverage floors
        run: pnpm test:fe:coverage

  # ──────────────────────────────────────────────
  # Java 调试 host：编译 + 自检（源码解析顺序 / 缓存布局 / 断点 FQN 推导）
  # host 是宿主 jar，Rust/cargo 门禁覆盖不到，故单列一个 job（需 JDK + Maven Central）
  # ──────────────────────────────────────────────
  java-host-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build.sh：下载 core + 依赖 → 编译 host → 自检（test.sh）→ 打 fat jar
      - name: Build host and run self-check
        run: bash tools/java-host/build.sh

  # ──────────────────────────────────────────────
  # 后端检查：全平台 check（发现跨平台编译问题）
  # ──────────────────────────────────────────────
  backend-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 门禁经 package.json 的脚本名调用（`pnpm lint:rust` / `pnpm test:rust`），
      # 因此需要 pnpm；脚本自带 --manifest-path，不需要 node_modules。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust check
        run: cargo check
        working-directory: ./src-tauri

      # 与本地 commit 档**同一条命令**（静态检查的定义单点在 package.json）：
      # fmt + clippy(-D warnings)。此前这两条只在本地 `pnpm lint` 里跑、CI 各自手写，
      # 于是同一个门有两份定义。
      - name: Rust static checks
        run: pnpm lint:rust

      # 护栏清单 = tools/guards/checks/ 目录本身；这里只声明「在哪个 stage 跑」，
      # 不再逐条列脚本（三份手写清单正是本地与 CI 门禁集漂移的根因）。
      - name: Run repository guards
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/guards/run.py run --stage ci --format github-actions

  backend-test:
    needs: backend-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 门禁经 package.json 的脚本名调用（`pnpm lint:rust` / `pnpm test:rust`），
      # 因此需要 pnpm；脚本自带 --manifest-path，不需要 node_modules。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # 与本地 push 档同一条命令（定义单点在 package.json）。
      - name: Rust test
        run: pnpm test:rust
