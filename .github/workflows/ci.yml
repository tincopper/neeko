name: CI

# PR 和 main 分支 push 时触发，前置发现质量问题
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # 前端检查：单平台即可（TypeScript/Vitest 无平台差异）
  # ──────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      # 与本地 commit 档**同一条命令**（静态检查的定义单点在 package.json）：eslint + tsc。
      # 此前 eslint 只在本地 pre-commit 跑、CI 不跑 ⇒ 门的强度取决于「谁装了钩子」。
      - name: Frontend static checks
        run: pnpm lint:fe

  frontend-test:
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      # 带覆盖率跑（同一趟测试，多出 v8 插桩开销 ~30%）：`vitest.config.ts` 里的地板
      # （全局回归底线 + 按文件 pin 的阈值）**只在这里生效** —— 此前 `test:fe:coverage`
      # 没有任何调用方，于是地板是装饰性的，`useFileEditorLsp.ts` 就是那样漂掉的。
      # 本地 push 档不跑它（延迟预算），要提前发现就跑 `pnpm test:fe:coverage`。
      - name: Unit tests + coverage floors
        run: pnpm test:fe:coverage

  # ──────────────────────────────────────────────
  # 打包门：tsc --noEmit + vite build（定义单点在 package.json 的 build）。
  # 此前 bundle 只在打 tag 的 build.yml 里**第一次**被执行 —— tsc 抓不到的打包期问题
  # （vite 插件、动态 import 解析、产物图异常）会一路溜到发版才炸。
  # 不 needs frontend-check：自带 tsc，静态检查结论不构成前置条件，独立并行出反馈更快。
  # ──────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Production build
        run: pnpm build

  # ──────────────────────────────────────────────
  # Java 调试 host：编译 + 自检（源码解析顺序 / 缓存布局 / 断点 FQN 推导）
  # host 是宿主 jar，Rust/cargo 门禁覆盖不到，故单列一个 job（需 JDK + Maven Central）
  # ──────────────────────────────────────────────
  java-host-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build:host 经 package.json 脚本名调用，因此需要 pnpm（脚本只跑 bash，
      # 不需要 node_modules，与 backend-check 的注释同理）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build.sh：下载 core + 依赖 → 编译 host → 自检（test.sh）→ 打 fat jar。
      # 经 package.json 脚本名调用（原则①：门禁不设裸脚本调用点）；与本地 pre-push 的
      # `pnpm test:host` 同源 —— build.sh 第 3 步就是跑同一份 test.sh。
      - name: Build host and run self-check
        run: pnpm build:host

  # ──────────────────────────────────────────────
  # 后端检查：全平台 check（发现跨平台编译问题）
  # ──────────────────────────────────────────────
  backend-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 门禁经 package.json 的脚本名调用（`pnpm lint:rust` / `pnpm test:rust`），
      # 因此需要 pnpm；脚本自带 --manifest-path，不需要 node_modules。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 工具链版本与组件的唯一定义点在仓库根 rust-toolchain.toml（rustup 会按它自动安装）。

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust check
        run: cargo check
        working-directory: ./src-tauri

      # 与本地 commit 档**同一条命令**（静态检查的定义单点在 package.json）：
      # fmt + clippy(-D warnings)。此前这两条只在本地 `pnpm lint` 里跑、CI 各自手写，
      # 于是同一个门有两份定义。
      - name: Rust static checks
        run: pnpm lint:rust

      # 护栏清单 = tools/guards/checks/ 目录本身；这里只声明「在哪个 stage 跑」，
      # 不再逐条列脚本（三份手写清单正是本地与 CI 门禁集漂移的根因）。
      - name: Run repository guards
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/guards/run.py run --stage ci --suite lint --source python --format github-actions

  backend-test:
    needs: backend-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 门禁经 package.json 的脚本名调用（`pnpm lint:rust` / `pnpm test:rust`），
      # 因此需要 pnpm；脚本自带 --manifest-path，不需要 node_modules。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 工具链版本与组件的唯一定义点在仓库根 rust-toolchain.toml（rustup 会按它自动安装）。

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # 与本地 push 档同一条命令（定义单点在 package.json）。
      - name: Rust test
        run: pnpm test:rust

  # ──────────────────────────────────────────────
  # Rust 覆盖率门禁：llvm-cov 只在 ubuntu 跑（Windows 支持差），重活只对**改动 Rust 的 PR** 生效。
  #
  # 为什么 job 常驻、只把重活做成条件步骤：required check 被 `if` 跳过时既不是成功也不是失败，
  # 合并会被永久 pending 卡住 —— 所以「跳过」必须是一个成功的步骤，判断只能放在 job 内部。
  # 为什么 package.json 也算 Rust 改动：地板（--fail-under-lines）就定义在那里。
  # 插桩是整棵依赖树的重建（本地实测 130s / 5.3GB 独立 target dir），因此这里**不挂 rust-cache**：
  # 仓库缓存预算 10GB，5.3GB 的插桩产物会挤掉另外 6 个 Rust job 的缓存。要提速再加缓存。
  # ──────────────────────────────────────────────
  backend-coverage:
    needs: backend-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'package.json'

      - name: Setup pnpm
        if: steps.changes.outputs.rust == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.changes.outputs.rust == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 工具链版本与组件（含 llvm-tools-preview）的唯一定义点在仓库根 rust-toolchain.toml。

      - name: Install cargo-llvm-cov
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux dependencies
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # 与本地同一条命令：地板（--fail-under-lines）定义在 package.json。
      - name: Rust coverage gate
        if: steps.changes.outputs.rust == 'true'
        run: pnpm test:rust:coverage
