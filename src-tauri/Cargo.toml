[package]
name = "neeko"
version = "1.0.10"
edition = "2021"
license = "Apache-2.0"
default-run = "neeko"

[lib]
name = "neeko_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["devtools", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
git2 = "0.20.4"
portable-pty = "0.8"
uuid = { version = "1.6", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = { version = "6", features = ["macos_fsevent"] }
dirs = "5.0"
log = "0.4"
russh = "0.50.0-beta.7"
russh-keys = "0.50.0-beta.7"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
zip = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
thiserror = "2"
which = "8.0.2"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
regex = "1"
urlencoding = "2"
base64 = "0.22"
url = "2"
arboard = "3.6.1"
open = { version = "5", features = ["shellexecute-on-windows"] }
lsp-server = "0.8.0"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.15"
# --- HTTP gateway (src/server)：进程内 C/S 服务端（任务 10-17-cs-http-gateway）---
# 版本均锁定为 Cargo.lock 既有版本；axum 为净新增（task design §9）。
# `tower` 只取 Layer/Service trait（不开 limit：并发上限自写 semaphore 中间件，
# tower::limit 的 poll_ready 是排队语义，与「超限立即拒绝」相反）。
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "timeout", "limit"] }
subtle = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# 直接依赖以访问 tauri with_webview 暴露的 WebView 句柄(强制 Inspector 独立窗口)
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# W2：自写 macOS FSEvents 后端需要直接调用 `FSEventStreamSetExclusionPaths`。
# 该 FFI 绑定已是 notify 的传递依赖（锁定 4.1.0），此处提为直接依赖，不新增任何 FFI crate。
fsevent-sys = "4.1"
# 移植 notify 的 fsevent.rs 需要 `bitflags!`（notify 在 macOS 上已依赖 2.x）。
bitflags = "2"
libproc = "0.14.11"
# 直接依赖以访问 tauri with_webview 暴露的 WKWebView 句柄(强制 Inspector 独立窗口)
objc2 = "0.6"
objc2-web-kit = "0.3"
# 系统通知 macOS 后端：NSUserNotification 已被移除（macOS 26+），必须走 UNUserNotificationCenter
# （platform/system_notify 消费，红线 10）
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSound", "UNUserNotificationCenter", "block2"] }
block2 = "0.6"

[lints.clippy]
# --- 正确性（Phase 4 完成：production unwrap 已消除）---
# 测试码豁免：`src/lib.rs` 与 `tests/unit.rs` 的 crate 根各有一条
# `#![cfg_attr(test, allow(clippy::expect_used, clippy::unwrap_used))]`
# —— 生产码仍是 deny（常规门禁的 clippy 构建不带 cfg(test)），测试断言不再顶红
# `cargo clippy --all-targets -D warnings`。必须用 `allow`：源码里的 `warn`
# 挡不住命令行 `-D warnings`（实测）。
# 全目标口径（2026-10-11 已清零并接入门禁）：`--all-targets` 下的 43 处既有 lint 已全部修复
# （cast 截断 → `try_from().expect()`、needless clone → `slice::from_ref`、测试模块挪到
# 文件末、常量断言提升为 `const _: ()` 等），当前 `cargo clippy --all-targets -- -D warnings`
# 在全仓全目标下 0 诊断。该命令 + fmt 已作为 gate `lint_rust_all_targets` 接入
# **local / push / ci** 三档（声明单源 `tools/guards/ledger/gates.json`；CI 步骤落在
# backend-check job）。commit 档保留 lib-only 的 `lint_rust`（暖缓存 ~10s 的快反馈），
# 它不再进 CI —— 全目标口径已覆盖 lib，避免同一判据跑两遍。
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# --- 模块可见性 ---
wildcard_imports = "deny"
module_inception = "deny"
needless_pass_by_ref_mut = "deny"
# --- 代码质量 ---
must_use_candidate = "warn"
missing_const_for_fn = "warn"
semicolon_if_nothing_returned = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
unused_self = "deny"
enum_glob_use = "deny"
fallible_impl_from = "deny"
large_enum_variant = "warn"
cast_lossless = "warn"
manual_string_new = "warn"
unnecessary_wraps = "warn"
redundant_else = "warn"

[lints.rust]
missing_docs = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[profile.dev]
debug = true  # 保留自己项目代码的完整调试信息

[profile.dev.package."*"]
debug = false # 关闭所有第三方依赖库的调试信息
